[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-toolkit"
version = "0.2.0"
description = "Utility library to accelerate development with common helpers for CSV, PDF, server, and API tasks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["utilities", "toolkit", "csv", "pdf", "server", "http", "xml"]
authors = [
    {name = "Rahil Shaikh"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.34.2",
]

[project.optional-dependencies]
pdf = ["pdf2image>=1.17.0"]
db = ["psycopg2-binary>=2.9.12"]
xml = ["xmltodict>=1.0.4"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests-mock>=1.12.1",
    "hypothesis>=6.156.6",
    "ruff>=0.15.22",
    "pre-commit>=4.6.1",
    "tox>=4.58.0",
]

[project.urls]
Homepage = "https://github.com/rahilsh/py-toolkit"
Source = "https://github.com/rahilsh/py-toolkit"
BugTracker = "https://github.com/rahilsh/py-toolkit/issues"

[project.scripts]
py-toolkit = "py_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["py_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["py_toolkit"]
omit = [
    "*/tests/*",
    "*/cli.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["N818"]

[tool.ruff.format]
quote-style = "double"
