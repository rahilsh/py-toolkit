[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-toolkit"
version = "0.1.0"
description = "Utility library to accelerate development with common helpers for CSV, PDF, server, and API tasks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["utilities", "toolkit", "csv", "pdf", "server", "http"]
authors = [
    {name = "Rahil Shaikh"},
]

dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
pdf = ["pdf2image>=1.17.0"]
db = ["psycopg2-binary>=2.9.9"]
xml = ["xmltodict>=0.14.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "requests-mock>=1.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["py_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["py_toolkit"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/statement/*",
    "*/utils/json_to_insert_queries.py",
    "*/zendesk/validate_user.py",
    "*/zendesk/zendesk_api.py",
    "*/pdf/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"
